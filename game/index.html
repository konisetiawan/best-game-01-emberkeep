<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emberkeep - Defend the Last Hearth</title>
    <style>
      :root { color-scheme: dark; background: #0d1026; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: grid; place-items: center; background: #0d1026; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <p id="status" aria-live="polite"></p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
